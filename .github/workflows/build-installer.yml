name: build-installer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone installer
        shell: powershell
        run: ./build.ps1
      - name: Smoke-test build artifact
        shell: powershell
        run: |
          if (!(Test-Path ./build/EOTInstaller.exe)) { throw 'EOTInstaller.exe missing' }
          if ((Get-Item ./build/EOTInstaller.exe).Length -lt 500000) { throw 'Installer is unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with:
          name: EOTInstaller-Windows-x64
          path: build/EOTInstaller.exe
